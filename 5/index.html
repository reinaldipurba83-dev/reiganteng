
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi Mahasiswa</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS sendiri -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h2 class="text-center mb-2">Registrasi Mahasiswa</h2>
            <p class="text-center text-muted mb-4">
                E-Learning Institut Teknologi Del
            </p>

            <form id="formRegistrasi" novalidate>

                <!-- Nama Lengkap -->
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama Lengkap</label>
                    <input type="text" class="form-control" id="nama"
                           placeholder="Masukkan nama lengkap">
                    <div class="error-message" id="errorNama"></div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" class="form-control" id="email"
                           placeholder="contoh@email.com">
                    <div class="error-message" id="errorEmail"></div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="Minimal 6 karakter">
                    <div class="error-message" id="errorPassword"></div>
                </div>

                <!-- Konfirmasi Password -->
                <div class="mb-3">
                    <label for="konfirmasi" class="form-label">
                        Konfirmasi Password
                    </label>
                    <input type="password" class="form-control" id="konfirmasi"
                           placeholder="Ulangi password">
                    <div class="error-message" id="errorKonfirmasi"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Daftar Sekarang
                </button>

            </form>
        </div>
    </div>

    <div class="modal fade" id="modalBerhasil" tabindex="-1"
         aria-labelledby="judulModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="judulModal">
                        Pendaftaran Berhasil
                    </h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Tutup"></button>
                </div>

                <div class="modal-body">
                    Pendaftaran berhasil. Selamat datang di E-Learning IT Del.
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-primary"
                            data-bs-dismiss="modal">
                        OK
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#formRegistrasi").submit(function (event) {
                event.preventDefault();

                let nama = $("#nama").val().trim();
                let email = $("#email").val().trim();
                let password = $("#password").val();
                let konfirmasi = $("#konfirmasi").val();

                let valid = true;

                $(".error-message").text("");
                $(".form-control").removeClass("is-invalid");

                if (nama === "") {
                    $("#errorNama").text("Nama lengkap tidak boleh kosong.");
                    $("#nama").addClass("is-invalid");
                    valid = false;
                }

                if (!email.includes("@")) {
                    $("#errorEmail").text("Email harus mengandung karakter @.");
                    $("#email").addClass("is-invalid");
                    valid = false;
                }

                if (password.length < 6) {
                    $("#errorPassword").text("Password minimal 6 karakter.");
                    $("#password").addClass("is-invalid");
                    valid = false;
                }

                if (password !== konfirmasi) {
                    $("#errorKonfirmasi").text("Konfirmasi password harus sama.");
                    $("#konfirmasi").addClass("is-invalid");
                    valid = false;
                }

                if (valid) {
                    $("#modalBerhasil").modal("show");
                    $("#formRegistrasi")[0].reset();
                }
            });

        });
    </script>

</body>
</html>
