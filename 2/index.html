
<!DOCTYPE html>
<html lang="id">
<head>

    <title>Reinaldi Official Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <nav>
            <a href="#home">Home</a>
            <a href="#produk">Produk</a>

            <article class="produk">

                <p>Rp150.000</p>

            <article class="produk">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSs1DtCKkLH_yJO2YBbwGi-8st2qVFLYpwXD7r1Rwy0QQ&s=10"
                     alt="Jam tangan">

    <footer id="kontak">
        <p>Toko Online Reinaldi</p>

</body>
</html>
